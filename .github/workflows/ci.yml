name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: TypeScript build check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Vite needs env vars to exist at build time; use stub values in CI.
      - name: Create stub .env for CI build
        run: |
          cp .env.example .env
          sed -i 's/your_firebase_api_key/ci-stub-key/g'              .env
          sed -i 's/your_project\.firebaseapp\.com/ci.firebaseapp.com/g' .env
          sed -i 's|https://your_project.*|https://ci-stub.firebasedatabase.app|g' .env
          sed -i 's/your_firebase_project_id/ci-project/g'             .env
          sed -i 's/your_messaging_sender_id/000000000000/g'           .env
          sed -i 's/your_app_id/1:000000000:web:0000000000000000/g'    .env
          sed -i 's/G-XXXXXXXXXX/G-STUBSTUB00/g'                       .env
          sed -i 's/service_xxxxxxx/service_ci/g'                      .env
          sed -i 's/template_xxxxxxx/template_ci/g'                    .env
          sed -i 's/your_emailjs_public_key/ci_key/g'                  .env

      - name: Build
        run: npm run build
